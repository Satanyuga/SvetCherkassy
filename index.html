<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Svet Cherkassy</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            overflow: hidden;
        }
        
        .clock { position: absolute; top: 20px; right: 20px; border: 1px solid #00ffcc; color: #00ffcc; padding: 5px 12px; border-radius: 8px; font-family: monospace; font-size: 14px; }
        .settings-btn { position: absolute; top: 20px; left: 20px; font-size: 24px; cursor: pointer; opacity: 0.8; transition: 0.3s; }
        .settings-btn:hover { opacity: 1; transform: scale(1.1); }
        
        #status-label { color: #888; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; text-align: center; }
        
        .countdown { 
            font-size: 18vw; 
            font-weight: 900; 
            font-family: 'Courier New', monospace; 
            line-height: 1; 
            margin: 10px 0 30px 0;
            text-shadow: 0 0 20px rgba(0,255,204,0.3);
        }
        @media (min-width: 600px) { .countdown { font-size: 100px; } }
        
        .red { color: #ff4444; text-shadow: 0 0 20px rgba(255,68,68,0.4); } 
        .green { color: #00ff66; text-shadow: 0 0 20px rgba(0,255,102,0.4); }
        
        .card { 
            background: rgba(22, 22, 22, 0.8); 
            padding: 25px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 380px; 
            border: 1px solid #333; 
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .card-header { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px; display: flex; justify-content: space-between; }
        .schedule-text { font-size: 20px; color: #ffcc00; font-weight: bold; line-height: 1.5; }
        
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-box { background: #111; padding: 30px; border-radius: 25px; text-align: center; border: 1px solid #444; width: 100%; max-width: 340px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 25px 0; }
        .g-btn { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px 5px; border-radius: 10px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .g-btn.active { border-color: #00ffcc; color: #00ffcc; background: rgba(0,255,204,0.1); }
        
        .tg-link { display: inline-block; margin-top: 10px; color: #0088cc; text-decoration: none; font-size: 14px; font-weight: bold; border-bottom: 1px solid #0088cc; padding-bottom: 2px; }
        .close-btn { margin-top: 25px; background: #333; border: none; color: #fff; padding: 10px 30px; border-radius: 10px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div class="settings-btn" onclick="document.getElementById('modal').style.display='flex'">⚙️</div>
    <div class="clock" id="clock">--:--:--</div>

    <div id="status-label">Загрузка данных...</div>
    <div id="timer" class="countdown">00:00:00</div>

    <div class="card">
        <div class="card-header">
            <span>ГРАФИК ОТКЛЮЧЕНИЙ</span>
            <span id="current-group">ОЧЕРЕДЬ: --</span>
        </div>
        <div class="schedule-text" id="sched-display">Синхронизация...</div>
    </div>

    <div id="modal">
        <div class="modal-box">
            <h3 style="margin-top:0">ВАША ОЧЕРЕДЬ</h3>
            <div class="grid" id="grid"></div>
            <a href="https://t.me/CherkassySvet_bot" class="tg-link">ПЕРЕЙТИ В БОТ 🔔</a>
            <button class="close-btn" onclick="document.getElementById('modal').style.display='none'">ГОТОВО</button>
        </div>
    </div>

    <script>
        let DATA = {};
        let GROUP = localStorage.getItem('userGroup') || "4.1";
        
        async function updateData() {
            try {
                let r = await fetch('/data.json?t=' + Date.now());
                DATA = await r.json();
                render();
            } catch (e) { 
                console.error("Ошибка загрузки:", e); 
                document.getElementById('sched-display').innerText = "Ошибка связи";
            }
        }

        function render() {
            document.getElementById('current-group').innerText = "ОЧЕРЕДЬ: " + GROUP;
            let sched = DATA[GROUP];
            let disp = document.getElementById('sched-display');
            
            if (sched) {
                disp.innerHTML = sched.split(',').map(s => `⚡ ${s.trim()}`).join('<br>');
                calculateTimer(sched);
            } else {
                disp.innerHTML = "<span style='color:#666'>График не найден</span>";
                document.getElementById('timer').innerText = "00:00:00";
                document.getElementById('status-label').innerText = "ДАННЫЕ ОТСУТСТВУЮТ";
            }
            
            let grid = document.getElementById('grid');
            grid.innerHTML = '';
            ['1.1','1.2','2.1','2.2','3.1','3.2','4.1','4.2','5.1','5.2','6.1','6.2'].forEach(g => {
                let btn = document.createElement('button');
                btn.className = `g-btn ${g === GROUP ? 'active' : ''}`;
                btn.innerText = g;
                btn.onclick = () => { GROUP = g; localStorage.setItem('userGroup', g); render(); };
                grid.appendChild(btn);
            });
        }

        function calculateTimer(schedStr) {
            let now = new Date();
            let kiev = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Kiev"}));
            let curMin = kiev.getHours() * 60 + kiev.getMinutes();
            let curSec = kiev.getSeconds();

            let intervals = (schedStr.match(/\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}/g) || []).map(range => {
                let [s, e] = range.split('-').map(t => {
                    let p = t.trim().split(':');
                    return parseInt(p[0]) * 60 + parseInt(p[1]);
                });
                return {start: s, end: e};
            }).sort((a,b) => a.start - b.start);

            let isOff = false;
            let target = null;

            for (let i of intervals) {
                if (curMin >= i.start && curMin < i.end) {
                    isOff = true;
                    target = i.end;
                    break;
                }
            }

            if (!isOff) {
                let next = intervals.find(i => i.start > curMin);
                if (next) target = next.start;
            }

            let timerEl = document.getElementById('timer');
            let labelEl = document.getElementById('status-label');

            if (isOff) {
                timerEl.className = "countdown red";
                labelEl.innerText = "СВЕТА НЕ БУДЕТ ЕЩЕ:";
            } else {
                timerEl.className = "countdown green";
                labelEl.innerText = target ? "СВЕТ БУДЕТ ЕЩЕ:" : "ГРАФИК ОКОНЧЕН";
            }

            if (target !== null) {
                let diff = (target - curMin) * 60 - curSec;
                if (diff < 0) diff = 0;
                let h = Math.floor(diff / 3600).toString().padStart(2, '0');
                let m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
                let s = (diff % 60).toString().padStart(2, '0');
                timerEl.innerText = `${h}:${m}:${s}`;
            } else {
                timerEl.innerText = "00:00:00";
            }
        }

        setInterval(() => {
            let d = new Date().toLocaleString("en-GB", {timeZone: "Europe/Kiev", hour:'2-digit', minute:'2-digit', second:'2-digit'});
            document.getElementById('clock').innerText = d;
            if (DATA[GROUP]) calculateTimer(DATA[GROUP]);
        }, 1000);

        setInterval(updateData, 10000);
        updateData();
    </script>
</body>
</html>
