<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свет 4.1</title>
    <style>
        body { 
            background: #0d0d0d; 
            color: #e0e0e0; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        /* Часы в углу */
        .clock {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1rem;
            color: #00ffcc;
            background: rgba(0, 255, 204, 0.1);
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #00ffcc;
        }
        .card { 
            background: #1a1a1a; 
            padding: 40px; 
            border-radius: 15px; 
            border: 2px solid #333; 
            text-align: center; 
            width: 90%; 
            max-width: 600px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h1 { margin: 0 0 20px; font-size: 1.5rem; text-transform: uppercase; color: #fff; }
        
        .schedule-box { 
            font-size: 1.8rem; /* Крупный шрифт для графика */
            margin: 30px 0; 
            color: #ffcc00; 
            font-weight: bold; 
            line-height: 1.4; 
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }
        
        .group { color: #666; font-size: 0.8rem; letter-spacing: 2px; }
        .status { font-size: 0.9rem; margin-top: 10px; color: #444; }
    </style>
</head>
<body>
    <div class="clock" id="kyiv-clock">--:--:--</div>

    <div class="card">
        <h1>График отключений</h1>
        <div id="schedule" class="schedule-box">Загрузка данных...</div>
        <div class="group">ГРУППА 4.1 | ЧЕРКАССЫ</div>
        <div class="status" id="last-update">Ожидание...</div>
    </div>

    <script>
        // Функция часов (Киев)
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('uk-UA', { 
                timeZone: 'Europe/Kiev',
                hour12: false 
            });
            document.getElementById('kyiv-clock').innerText = "KIEV: " + timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Загрузка графика
        async function loadSchedule() {
            try {
                // t=Math.random() чтобы не кэшировалось
                const response = await fetch('data.json?t=' + Math.random());
                const data = await response.json();
                
                if (data.schedule) {
                    document.getElementById('schedule').innerText = data.schedule;
                    document.getElementById('last-update').innerText = "Данные получены";
                } else {
                    document.getElementById('schedule').innerText = "Пусто";
                }
            } catch (e) {
                console.error(e);
            }
        }
        
        loadSchedule();
        setInterval(loadSchedule, 30000); // Обновляем данные каждые 30 сек
    </script>
</body>
</html>
