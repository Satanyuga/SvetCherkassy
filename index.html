<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>График Света 4.1</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #111; padding: 30px; border-radius: 20px; border: 1px solid #333; text-align: center; width: 90%; max-width: 400px; }
        h1 { color: #00ffcc; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }
        .schedule-box { font-size: 1.5rem; margin: 20px 0; color: #00ffcc; font-weight: bold; line-height: 1.6; }
        .group { color: #555; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>График отключений</h1>
        <div id="schedule" class="schedule-box">Загрузка...</div>
        <div class="group">ГРУППА 4.1</div>
    </div>

    <script>
        async function loadSchedule() {
            try {
                // Добавляем случайное число, чтобы файл не кешировался
                const response = await fetch('data.json?t=' + Math.random());
                const data = await response.json();
                document.getElementById('schedule').innerText = data.schedule;
            } catch (e) {
                document.getElementById('schedule').innerText = "Нет данных";
            }
        }
        loadSchedule();
        setInterval(loadSchedule, 60000); // Проверять обновление раз в минуту
    </script>
</body>
</html>
