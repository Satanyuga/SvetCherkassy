<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svet 4.1 App</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    
    <style>
        body { 
            background: #0a0a0a; 
            color: #fff; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            height: 100vh; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
        }
        
        .clock { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            color: #00ffcc; 
            border: 1px solid #00ffcc; 
            padding: 5px 10px; 
            border-radius: 5px; 
            font-family: monospace; 
            font-size: 0.9rem;
        }
        
        .countdown { 
            font-size: 4rem; 
            font-weight: bold; 
            margin-bottom: 5px; 
            font-family: monospace; 
        }
        
        .timer-red { color: #ff4444; text-shadow: 0 0 15px #ff4444; }
        .timer-green { color: #00ff66; text-shadow: 0 0 15px #00ff66; }
        
        .timer-label { 
            font-size: 1rem; 
            color: #888; 
            text-transform: uppercase; 
            margin-bottom: 25px; 
            font-weight: bold; 
            letter-spacing: 2px;
        }

        .card { 
            background: #111; 
            padding: 30px; 
            border-radius: 25px; 
            border: 1px solid #222; 
            text-align: center; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.7); 
            width: 85%; 
            max-width: 450px; 
        }
        
        .schedule { 
            font-size: 1.8rem; 
            color: #ffcc00; 
            font-weight: bold; 
            margin: 15px 0; 
            line-height: 1.8; 
            text-align: left; 
            display: inline-block;
        }
        
        .group-label { 
            color: #444; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-size: 0.7rem; 
            margin-top: 15px; 
        }
        
        .status-container { 
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            text-align: left; 
            font-size: 0.75rem; 
            color: #555; 
        }
        
        .status-item { margin: 6px 0; display: flex; align-items: center; }
        .dot { width: 9px; height: 9px; border-radius: 50%; margin-right: 12px; }
        .online { background: #00ff66; box-shadow: 0 0 8px #00ff66; }
        .offline { background: #ff4444; box-shadow: 0 0 8px #ff4444; }

        button.notif-btn {
            background: #222;
            color: #888;
            border: 1px solid #333;
            padding: 8px 15px;
            border-radius: 10px;
            margin-top: 20px;
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="clock" id="kiev-time">KIEV: --:--:--</div>

    <div id="timer-val" class="countdown">00:00:00</div>
    <div id="timer-comment" class="timer-label">СИНХРОНИЗАЦИЯ...</div>

    <div class="card">
        <div style="color: #444; font-size: 0.7rem; margin-bottom: 15px; letter-spacing: 3px;">ГРАФИК ОТКЛЮЧЕНИЙ 4.1</div>
        <div class="schedule" id="sched-text">ЗАГРУЗКА...</div>
        <div class="group-label">ЧЕРКАССЫ ОБЛЭНЕРГО</div>
        
        <button class="notif-btn" onclick="requestNotif()">🔔 Включить уведомления</button>
    </div>

    <div class="status-container">
        <div class="status-item"><div class="dot offline"></div> Группа облэнерго: ОТКЛЮЧЕН (ЛИЧКА)</div>
        <div class="status-item"><div class="dot online"></div> Телеграм бот: ПОДКЛЮЧЕН</div>
    </div>

    <script>
        let currentSchedule = "";

        // Регистрация Service Worker для PWA и уведомлений
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                console.log('SW зарегистрирован');
            });
        }

        function requestNotif() {
            if ('Notification' in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        alert('Уведомления включены! Теперь ты будешь получать алерты.');
                    }
                });
            }
        }

        function updateTime() {
            const now = new Date();
            const options = { timeZone: 'Europe/Kiev', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const kievTimeStr = new Intl.DateTimeFormat('en-GB', options).format(now);
            document.getElementById('kiev-time').innerText = "KIEV: " + kievTimeStr;
            processLogic();
        }

        async function refreshData() {
            try {
                const r = await fetch('data.json?v=' + Date.now());
                const d = await r.json();
                if (d.schedule && d.schedule !== currentSchedule) {
                    currentSchedule = d.schedule;
                    const formatted = d.schedule.split(',').map(i => "⚡ " + i.trim()).join('<br>');
                    document.getElementById('sched-text').innerHTML = formatted;
                }
            } catch(e) { console.error("Ошибка сети"); }
        }

        function toMinutes(timeStr) {
            const parts = timeStr.trim().split(':');
            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
        }

        function processLogic() {
            if (!currentSchedule) return;

            const now = new Date();
            const kievTime = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Kiev"}));
            const curMin = kievTime.getHours() * 60 + kievTime.getMinutes();
            const curSec = kievTime.getSeconds();
            
            const intervals = currentSchedule.match(/\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}/g) || [];
            let parsedIntervals = intervals.map(range => {
                const [start, end] = range.split('-').map(toMinutes);
                return { start, end: (end === 0 || end < start) ? 1440 : end };
            }).sort((a, b) => a.start - b.start);

            let isOff = false;
            let targetMin = null;

            for (let interval of parsedIntervals) {
                if (curMin >= interval.start && curMin < interval.end) {
                    isOff = true;
                    targetMin = interval.end;
                    break;
                }
            }

            if (!isOff) {
                const nextOff = parsedIntervals.find(i => i.start > curMin);
                if (nextOff) {
                    targetMin = nextOff.start;
                }
            }

            const timerEl = document.getElementById('timer-val');
            const commentEl = document.getElementById('timer-comment');

            if (isOff) {
                timerEl.className = "countdown timer-red";
                commentEl.innerText = "ДО ВКЛЮЧЕНИЯ СВЕТА:";
            } else {
                timerEl.className = "countdown timer-green";
                commentEl.innerText = "СВЕТ БУДЕТ ЕЩЕ:";
            }

            if (targetMin !== null) {
                const totalSecondsLeft = (targetMin - curMin) * 60 - curSec;
                if (totalSecondsLeft > 0) {
                    const h = Math.floor(totalSecondsLeft / 3600).toString().padStart(2, '0');
                    const m = Math.floor((totalSecondsLeft % 3600) / 60).toString().padStart(2, '0');
                    const s = (totalSecondsLeft % 60).toString().padStart(2, '0');
                    timerEl.innerText = `${h}:${m}:${s}`;
                } else {
                    timerEl.innerText = "00:00:00";
                }
            } else {
                timerEl.innerText = "00:00:00";
                commentEl.innerText = "ГРАФИК НА СЕГОДНЯ ЗАВЕРШЕН";
            }
        }

        setInterval(updateTime, 1000);
        setInterval(refreshData, 10000);
        refreshData();
    </script>
</body>
</html>
