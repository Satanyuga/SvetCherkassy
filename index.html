<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svet 4.1 Debug</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; height: 100vh; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .clock { position: absolute; top: 20px; right: 20px; color: #00ffcc; border: 1px solid #00ffcc; padding: 5px 10px; border-radius: 5px; font-family: monospace; }
        .card { background: #111; padding: 50px; border-radius: 20px; border: 1px solid #222; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .schedule { font-size: 2.2rem; color: #ffcc00; font-weight: bold; margin: 20px 0; }
        .group-label { color: #444; text-transform: uppercase; letter-spacing: 3px; font-size: 0.8rem; }
        
        /* Статусы внизу слева */
        .status-container { position: absolute; bottom: 20px; left: 20px; text-align: left; font-size: 0.7rem; color: #666; }
        .status-item { margin: 5px 0; display: flex; align-items: center; }
        .dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 10px; }
        .online { background: #00ff66; box-shadow: 0 0 5px #00ff66; }
    </style>
</head>
<body>
    <div class="clock" id="kiev-time">KIEV: --:--:--</div>

    <div class="card">
        <div class="group-label">График отключений 4.1</div>
        <div class="schedule" id="sched-text">ОЖИДАНИЕ...</div>
    </div>

    <div class="status-container">
        <div class="status-item"><div class="dot online"></div> Группа облэнерго: ПОДКЛЮЧЕН</div>
        <div class="status-item"><div class="dot online"></div> Телеграм бот: ПОДКЛЮЧЕН</div>
    </div>

    <script>
        function updateTime() {
            document.getElementById('kiev-time').innerText = "KIEV: " + new Date().toLocaleTimeString('uk-UA', {timeZone:'Europe/Kiev'});
        }
        setInterval(updateTime, 1000);
        updateTime();

        async function refresh() {
            try {
                const r = await fetch('data.json?v=' + Date.now());
                const d = await r.json();
                document.getElementById('sched-text').innerText = d.schedule || "НЕТ ДАННЫХ";
            } catch(e) {}
        }
        setInterval(refresh, 5000);
        refresh();
    </script>
</body>
</html>
