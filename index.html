<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Svet Cherkassy</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .clock { position: absolute; top: 15px; right: 15px; border: 1px solid #00ffcc; color: #00ffcc; padding: 5px 10px; border-radius: 5px; font-family: monospace; }
        .settings-btn { position: absolute; top: 15px; left: 15px; font-size: 24px; cursor: pointer; opacity: 0.7; }
        
        .countdown { font-size: 14vw; font-weight: bold; margin-top: 50px; font-family: monospace; line-height: 1; }
        @media (min-width: 600px) { .countdown { font-size: 80px; } }
        
        .label { color: #888; font-size: 14px; margin-bottom: 30px; letter-spacing: 1px; }
        .red { color: #ff4444; } .green { color: #00ff66; }
        
        .card { background: #161616; padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; border: 1px solid #333; }
        .card-header { font-size: 12px; color: #555; text-transform: uppercase; margin-bottom: 10px; }
        .schedule-text { font-size: 24px; color: #ffcc00; font-weight: bold; line-height: 1.4; }
        
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; }
        .modal-box { background: #111; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #444; width: 90%; max-width: 350px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .g-btn { background: #222; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; }
        .g-btn.active { border-color: #00ffcc; color: #00ffcc; }
        
        .tg-link { display: block; margin-top: 20px; background: #0088cc; color: white; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: bold; }
        .close-btn { margin-top: 15px; background: none; border: none; color: #666; cursor: pointer; }
    </style>
</head>
<body>

    <div class="settings-btn" onclick="document.getElementById('modal').style.display='flex'">⚙️</div>
    <div class="clock" id="clock">--:--:--</div>

    <div id="timer" class="countdown">00:00:00</div>
    <div id="status-label" class="label">ЗАГРУЗКА...</div>

    <div class="card">
        <div class="card-header">ВАША ОЧЕРЕДЬ: <span id="current-group">--</span></div>
        <div class="schedule-text" id="sched-display">...</div>
    </div>

    <div id="modal">
        <div class="modal-box">
            <h3>ВЫБЕРИТЕ ОЧЕРЕДЬ</h3>
            <div class="grid" id="grid"></div>
            <a href="https://t.me/svet_cherkassy_bot" class="tg-link">🔔 БОТ УВЕДОМЛЕНИЙ</a>
            <button class="close-btn" onclick="document.getElementById('modal').style.display='none'">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        let DATA = {};
        let GROUP = localStorage.getItem('userGroup') || "4.1";
        
        async function updateData() {
            try {
                // Добавляем timestamp чтобы не кэшировалось
                let r = await fetch('data.json?t=' + Date.now());
                DATA = await r.json();
                render();
            } catch (e) { console.error(e); }
        }

        function render() {
            document.getElementById('current-group').innerText = GROUP;
            let sched = DATA[GROUP];
            
            // Отрисовка графика
            let disp = document.getElementById('sched-display');
            if (sched) {
                disp.innerHTML = sched.split(',').map(s => `⚡ ${s.trim()}`).join('<br>');
                calculateTimer(sched);
            } else {
                disp.innerText = "Нет данных";
                document.getElementById('timer').innerText = "--:--:--";
            }
            
            // Отрисовка кнопок
            let grid = document.getElementById('grid');
            grid.innerHTML = '';
            ['1.1','1.2','2.1','2.2','3.1','3.2','4.1','4.2','5.1','5.2','6.1','6.2'].forEach(g => {
                let btn = document.createElement('button');
                btn.className = `g-btn ${g === GROUP ? 'active' : ''}`;
                btn.innerText = g;
                btn.onclick = () => { GROUP = g; localStorage.setItem('userGroup', g); render(); };
                grid.appendChild(btn);
            });
        }

        function calculateTimer(schedStr) {
            // Парсим время
            let now = new Date();
            // Получаем время в Киеве
            let kievTime = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Kiev"}));
            let curMin = kievTime.getHours() * 60 + kievTime.getMinutes();
            let curSec = kievTime.getSeconds();

            // Парсим интервалы "00:00-02:00"
            let intervals = (schedStr.match(/\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}/g) || []).map(range => {
                let [s, e] = range.split('-').map(t => {
                    let p = t.split(':');
                    return parseInt(p[0]) * 60 + parseInt(p[1]);
                });
                if (e < s) e = 1440; // Если переход через полночь (пока ставим конец дня)
                return {start: s, end: e};
            }).sort((a,b) => a.start - b.start);

            let isOff = false;
            let target = null;

            // Проверяем, выключен ли свет сейчас
            for (let i of intervals) {
                if (curMin >= i.start && curMin < i.end) {
                    isOff = true;
                    target = i.end;
                    break;
                }
            }

            // Если свет есть, ищем следующее отключение
            if (!isOff) {
                let next = intervals.find(i => i.start > curMin);
                if (next) target = next.start;
            }

            let timerEl = document.getElementById('timer');
            let labelEl = document.getElementById('status-label');

            if (isOff) {
                timerEl.className = "countdown red";
                labelEl.innerText = "СВЕТА НЕ БУДЕТ ЕЩЕ:";
            } else {
                timerEl.className = "countdown green";
                labelEl.innerText = target ? "СВЕТ БУДЕТ ЕЩЕ:" : "ГРАФИК ЗАВЕРШЕН";
            }

            if (target !== null) {
                let diff = (target - curMin) * 60 - curSec;
                if (diff < 0) diff = 0;
                let h = Math.floor(diff / 3600).toString().padStart(2, '0');
                let m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
                let s = (diff % 60).toString().padStart(2, '0');
                timerEl.innerText = `${h}:${m}:${s}`;
            } else {
                timerEl.innerText = "00:00:00";
            }
        }

        setInterval(() => {
            let d = new Date().toLocaleString("en-GB", {timeZone: "Europe/Kiev", hour:'2-digit', minute:'2-digit', second:'2-digit'});
            document.getElementById('clock').innerText = d;
            if (DATA[GROUP]) calculateTimer(DATA[GROUP]);
        }, 1000);

        setInterval(updateData, 5000); // Обновление данных каждые 5 сек
        updateData();
    </script>
</body>
</html>
