<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Svet Monitor</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #0a0a0a; color: #fff; font-family: sans-serif; 
            min-height: 100vh; margin: 0; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; padding: 20px;
        }
        .settings-icon { position: fixed; top: 15px; left: 15px; font-size: 1.5rem; cursor: pointer; opacity: 0.5; padding: 10px; }
        .clock { position: fixed; top: 15px; right: 15px; color: #00ffcc; border: 1px solid #00ffcc; padding: 4px 10px; border-radius: 6px; font-family: monospace; font-size: 0.8rem; }
        .countdown { font-size: 4rem; font-weight: bold; font-family: monospace; }
        .timer-red { color: #ff4444; } .timer-green { color: #00ff66; }
        .timer-label { font-size: 0.85rem; color: #888; margin-bottom: 25px; }
        .card { background: #111; padding: 25px; border-radius: 22px; border: 1px solid #222; text-align: center; width: 100%; max-width: 400px; }
        .schedule { font-size: 1.6rem; color: #ffcc00; font-weight: bold; margin: 10px 0; text-align: left; display: inline-block; }
        .tg-link { background: #0088cc; color: #fff; text-decoration: none; display: block; padding: 12px; border-radius: 12px; margin-top: 15px; font-weight: bold; font-size: 0.8rem; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center; }
        .modal-content { background: #111; padding: 20px; border-radius: 20px; text-align: center; width: 90%; max-width: 350px; border: 1px solid #333; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .g-btn { padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; }
        .g-btn.active { border-color: #00ffcc; color: #00ffcc; }
    </style>
</head>
<body>
    <div class="settings-icon" onclick="document.getElementById('modal').style.display='flex'">⚙️</div>
    <div class="clock" id="k-time">--:--:--</div>
    <div id="t-val" class="countdown">00:00:00</div>
    <div id="t-lab" class="timer-label">ЗАГРУЗКА...</div>
    <div class="card">
        <div style="color:#444; font-size:0.7rem; letter-spacing:2px;">ОЧЕРЕДЬ <span id="g-num">--</span></div>
        <div class="schedule" id="s-txt">...</div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h3 style="color:#00ffcc">НАСТРОЙКИ</h3>
            <div class="grid" id="grid"></div>
            <a href="https://t.me/svet_cherkassy_bot" class="tg-link">🔔 УВЕДОМЛЕНИЯ В TELEGRAM</a>
            <button style="margin-top:20px; background:none; border:none; color:#555;" onclick="document.getElementById('modal').style.display='none'">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        let data = {}; let group = localStorage.getItem('userGroup') || "1.1";
        async function load() {
            try { const r = await fetch('data.json?v=' + Date.now()); data = await r.json(); render(); } catch(e){}
        }
        function render() {
            document.getElementById('g-num').innerText = group;
            const s = data[group];
            if(s) {
                document.getElementById('s-txt').innerHTML = s.split(',').map(i => "⚡ " + i.trim()).join('<br>');
                calc(s);
            }
            const grid = document.getElementById('grid'); grid.innerHTML = '';
            ['1.1','1.2','2.1','2.2','3.1','3.2','4.1','4.2','5.1','5.2','6.1','6.2'].forEach(g => {
                const b = document.createElement('button'); b.className = 'g-btn' + (g==group?' active':'');
                b.innerText = g; b.onclick = () => { group = g; localStorage.setItem('userGroup', g); render(); };
                grid.appendChild(b);
            });
        }
        function calc(s) {
            const now = new Date();
            const k = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Kiev"}));
            const cur = k.getHours()*60 + k.getMinutes();
            const sec = k.getSeconds();
            const match = s.match(/\d{1,2}:\d{2}-\d{1,2}:\d{2}/g) || [];
            let ivs = match.map(r => {
                const [st, en] = r.split('-').map(t => {
                    const p = t.split(':'); return parseInt(p[0])*60 + parseInt(p[1]);
                });
                return { s: st, e: (en<st?1440:en) };
            }).sort((a,b) => a.s - b.s);
            let off = false; let target = null;
            for(let i of ivs) { if(cur>=i.s && cur<i.e) { off = true; target = i.e; break; } }
            if(!off) { const n = ivs.find(i => i.s > cur); if(n) target = n.s; }
            const v = document.getElementById('t-val'); const l = document.getElementById('t-lab');
            v.className = 'countdown ' + (off?'timer-red':'timer-green');
            l.innerText = off ? "ДО ВКЛЮЧЕНИЯ:" : "СВЕТ БУДЕТ ЕЩЕ:";
            if(target) {
                const d = (target - cur)*60 - sec;
                const h = Math.floor(d/3600).toString().padStart(2,'0');
                const m = Math.floor((d%3600)/60).toString().padStart(2,'0');
                const sc = (d%60).toString().padStart(2,'0');
                v.innerText = `${h}:${m}:${sc}`;
            } else v.innerText = "00:00:00";
        }
        setInterval(() => {
            const n = new Date(); const opt = { timeZone: 'Europe/Kiev', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('k-time').innerText = new Intl.DateTimeFormat('en-GB', opt).format(n);
            if(data[group]) calc(data[group]);
        }, 1000);
        setInterval(load, 10000); load();
    </script>
</body>
</html>
