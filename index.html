<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Svet 4.1 App</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #0a0a0a; 
            color: #fff; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            height: 100vh; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            position: relative;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .clock { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            color: #00ffcc; 
            border: 1px solid #00ffcc; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-family: monospace; 
            font-size: 0.85rem;
            z-index: 10;
        }
        
        .countdown { 
            font-size: clamp(3.2rem, 16vw, 4.8rem);
            font-weight: bold; 
            margin-bottom: 5px; 
            font-family: monospace; 
            line-height: 1;
        }
        
        .timer-red { color: #ff4444; text-shadow: 0 0 15px rgba(255, 68, 68, 0.4); }
        .timer-green { color: #00ff66; text-shadow: 0 0 15px rgba(0, 255, 102, 0.4); }
        
        .timer-label { 
            font-size: 0.9rem; 
            color: #888; 
            text-transform: uppercase; 
            margin-bottom: 25px; 
            font-weight: bold; 
            letter-spacing: 1px;
        }

        .card { 
            background: #111; 
            padding: 25px; 
            border-radius: 22px; 
            border: 1px solid #222; 
            text-align: center; 
            box-shadow: 0 12px 40px rgba(0,0,0,0.8); 
            width: 92%; 
            max-width: 400px;
            z-index: 5;
        }
        
        .schedule { 
            font-size: 1.6rem; 
            color: #ffcc00; 
            font-weight: bold; 
            margin: 12px 0; 
            line-height: 1.6; 
            text-align: left; 
            display: inline-block;
        }
        
        .group-label { 
            color: #444; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-size: 0.7rem; 
            margin-top: 12px; 
        }
        
        /* Исправленные статусы: подняты выше, чтобы не съедались браузером */
        .status-container { 
            position: absolute; 
            bottom: 30px; 
            left: 20px; 
            text-align: left; 
            font-size: 0.75rem; 
            color: #555; 
            z-index: 2;
        }
        
        .status-item { display: flex; align-items: center; margin-bottom: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 12px; }
        .online { background: #00ff66; box-shadow: 0 0 6px #00ff66; }
        .offline { background: #ff4444; box-shadow: 0 0 6px #ff4444; }

        .notif-btn {
            background: #1a1a1a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 12px;
            border-radius: 14px;
            margin-top: 15px;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
            transition: 0.2s;
            font-weight: bold;
        }
        .notif-btn.active {
            border-color: #ff4444;
            color: #ff4444;
            background: rgba(255, 68, 68, 0.05);
        }
    </style>
</head>
<body>

    <div class="clock" id="kiev-time">KIEV: --:--:--</div>

    <div id="timer-val" class="countdown">00:00:00</div>
    <div id="timer-comment" class="timer-label">СИНХРОНИЗАЦИЯ...</div>

    <div class="card">
        <div style="color: #444; font-size: 0.65rem; letter-spacing: 3px; margin-bottom: 8px;">ГРАФИК ОТКЛЮЧЕНИЙ 4.1</div>
        <div class="schedule" id="sched-text">ЗАГРУЗКА...</div>
        <div class="group-label">ЧЕРКАССЫ ОБЛЭНЕРГО</div>
        
        <button id="notif-btn" class="notif-btn" onclick="handleNotif()">🔔 Включить уведомления</button>
    </div>

    <div class="status-container">
        <div class="status-item"><div class="dot offline"></div> Группа облэнерго: ОТКЛЮЧЕН (ЛИЧКА)</div>
        <div class="status-item"><div class="dot online"></div> Телеграм бот: ПОДКЛЮЧЕН</div>
    </div>

    <script>
        let currentSchedule = "";

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        window.onload = () => {
            if (Notification.permission === 'granted') {
                updateButtonState(true);
            }
        };

        function handleNotif() {
            if (!('Notification' in window)) {
                alert('Ваш браузер не поддерживает уведомления.');
                return;
            }

            if (Notification.permission === 'granted') {
                // Если уже включено, объясняем как выключить
                alert('Уведомления уже разрешены на системном уровне. Если вы хотите их отключить, сделайте это в настройках браузера или приложения (раздел "Уведомления").');
                updateButtonState(true);
            } else {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        updateButtonState(true);
                        alert('Уведомления включены!');
                    }
                });
            }
        }

        function updateButtonState(isGranted) {
            const btn = document.getElementById('notif-btn');
            if (isGranted) {
                btn.innerText = "🔕 Уведомления активны";
                btn.classList.add('active');
            } else {
                btn.innerText = "🔔 Включить уведомления";
                btn.classList.remove('active');
            }
        }

        function updateTime() {
            const now = new Date();
            const options = { timeZone: 'Europe/Kiev', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const kievTimeStr = new Intl.DateTimeFormat('en-GB', options).format(now);
            document.getElementById('kiev-time').innerText = "KIEV: " + kievTimeStr;
            processLogic();
        }

        async function refreshData() {
            try {
                const r = await fetch('data.json?v=' + Date.now());
                const d = await r.json();
                if (d.schedule && d.schedule !== currentSchedule) {
                    currentSchedule = d.schedule;
                    const formatted = d.schedule.split(',').map(i => "⚡ " + i.trim()).join('<br>');
                    document.getElementById('sched-text').innerHTML = formatted;
                }
            } catch(e) {}
        }

        function toMinutes(timeStr) {
            const parts = timeStr.trim().split(':');
            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
        }

        function processLogic() {
            if (!currentSchedule) return;
            const now = new Date();
            const kievTime = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Kiev"}));
            const curMin = kievTime.getHours() * 60 + kievTime.getMinutes();
            const curSec = kievTime.getSeconds();
            
            const intervals = currentSchedule.match(/\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}/g) || [];
            let parsedIntervals = intervals.map(range => {
                const [start, end] = range.split('-').map(toMinutes);
                return { start, end: (end === 0 || end < start) ? 1440 : end };
            }).sort((a, b) => a.start - b.start);

            let isOff = false;
            let targetMin = null;

            for (let interval of parsedIntervals) {
                if (curMin >= interval.start && curMin < interval.end) {
                    isOff = true;
                    targetMin = interval.end;
                    break;
                }
            }

            if (!isOff) {
                const nextOff = parsedIntervals.find(i => i.start > curMin);
                if (nextOff) targetMin = nextOff.start;
            }

            const timerEl = document.getElementById('timer-val');
            const commentEl = document.getElementById('timer-comment');

            if (isOff) {
                timerEl.className = "countdown timer-red";
                commentEl.innerText = "ДО ВКЛЮЧЕНИЯ СВЕТА:";
            } else {
                timerEl.className = "countdown timer-green";
                commentEl.innerText = "СВЕТ БУДЕТ ЕЩЕ:";
            }

            if (targetMin !== null) {
                const diff = (targetMin - curMin) * 60 - curSec;
                if (diff > 0) {
                    const h = Math.floor(diff / 3600).toString().padStart(2, '0');
                    const m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
                    const s = (diff % 60).toString().padStart(2, '0');
                    timerEl.innerText = `${h}:${m}:${s}`;
                } else { timerEl.innerText = "00:00:00"; }
            } else {
                timerEl.innerText = "00:00:00";
                commentEl.innerText = "ГРАФИК НА СЕГОДНЯ ЗАВЕРШЕН";
            }
        }

        setInterval(updateTime, 1000);
        setInterval(refreshData, 10000);
        refreshData();
    </script>
</body>
</html>
