<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Svet Monitor</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #0a0a0a; color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; 
            min-height: 100vh; margin: 0; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; overflow-x: hidden; padding: 20px;
        }
        
        .settings-icon {
            position: fixed; top: 15px; left: 15px; font-size: 1.5rem; cursor: pointer; z-index: 101; opacity: 0.5;
            padding: 10px;
        }

        .clock { 
            position: fixed; top: 15px; right: 15px; color: #00ffcc; border: 1px solid #00ffcc; 
            padding: 4px 10px; border-radius: 6px; font-family: monospace; font-size: 0.8rem; z-index: 100;
            background: rgba(10, 10, 10, 0.8);
        }
        
        .countdown { 
            font-size: clamp(3.2rem, 16vw, 4.8rem); font-weight: bold; margin-bottom: 5px; 
            font-family: monospace; line-height: 1;
        }
        
        .timer-red { color: #ff4444; text-shadow: 0 0 15px rgba(255, 68, 68, 0.3); }
        .timer-green { color: #00ff66; text-shadow: 0 0 15px rgba(0, 255, 102, 0.3); }
        
        .timer-label { 
            font-size: 0.85rem; color: #888; text-transform: uppercase; 
            margin-bottom: 25px; font-weight: bold; letter-spacing: 1px;
        }

        .card { 
            background: #111; padding: 25px; border-radius: 22px; border: 1px solid #222; 
            text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.8); width: 100%; max-width: 400px;
        }
        
        .schedule { 
            font-size: 1.6rem; color: #ffcc00; font-weight: bold; margin: 10px 0; 
            line-height: 1.6; text-align: left; display: inline-block; min-height: 50px;
        }
        
        .group-header { color: #444; font-size: 0.7rem; letter-spacing: 3px; margin-bottom: 8px; text-transform: uppercase; }

        .status-wrapper { width: 100%; max-width: 400px; margin-top: 15px; padding-left: 10px; }
        .status-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 0.7rem; color: #555; text-transform: uppercase; }
        .dot { width: 7px; height: 7px; border-radius: 50%; margin-right: 10px; }
        .online { background: #00ff66; } .offline { background: #ff4444; }

        #group-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 200; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #111; padding: 25px; border-radius: 20px; text-align: center; width: 90%; max-width: 320px;
            border: 1px solid #333;
        }
        .group-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .group-btn {
            padding: 15px; background: #1a1a1a; border: 1px solid #333; color: #fff; 
            border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1rem;
        }

        .notif-btn {
            background: #1a1a1a; color: #00ffcc; border: 1px solid #00ffcc; padding: 12px;
            border-radius: 14px; margin-top: 15px; cursor: pointer; font-size: 0.85rem; width: 100%; font-weight: bold;
        }
        .notif-btn.active { border-color: #ff4444; color: #ff4444; background: rgba(255, 68, 68, 0.05); }
    </style>
</head>
<body>

    <div class="settings-icon" onclick="openModal()">⚙️</div>
    <div class="clock" id="kiev-time">KIEV: --:--:--</div>

    <div id="timer-val" class="countdown">00:00:00</div>
    <div id="timer-comment" class="timer-label">СИНХРОНИЗАЦИЯ...</div>

    <div class="card">
        <div class="group-header" id="group-title">ГРАФИК ОТКЛЮЧЕНИЙ</div>
        <div class="schedule" id="sched-text">ЗАГРУЗКА...</div>
        <div style="color: #444; text-transform: uppercase; letter-spacing: 2px; font-size: 0.65rem; margin-top: 12px;">ЧЕРКАССЫ ОБЛЭНЕРГО</div>
        <button id="notif-btn" class="notif-btn" onclick="handleNotif()">🔔 Включить уведомления</button>
    </div>

    <div class="status-wrapper">
        <div class="status-item"><div class="dot offline"></div> ОБЛЭНЕРГО: ЛИЧКА</div>
        <div class="status-item"><div class="dot online"></div> БОТ: ПОДКЛЮЧЕН</div>
    </div>

    <div id="group-modal">
        <div class="modal-content">
            <h3 style="margin:0; color:#00ffcc;">ВАША ГРУППА?</h3>
            <div class="group-grid">
                <button class="group-btn" onclick="setGroup('1.1')">1.1</button>
                <button class="group-btn" onclick="setGroup('2.1')">2.1</button>
                <button class="group-btn" onclick="setGroup('3.1')">3.1</button>
                <button class="group-btn" onclick="setGroup('4.1')">4.1</button>
                <button class="group-btn" onclick="setGroup('5.1')">5.1</button>
                <button class="group-btn" onclick="setGroup('6.1')">6.1</button>
            </div>
        </div>
    </div>

    <script>
        let fullData = {};
        let userGroup = localStorage.getItem('userGroup') || "4.1";

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        function openModal() { document.getElementById('group-modal').style.display = 'flex'; }
        
        function setGroup(g) {
            userGroup = g;
            localStorage.setItem('userGroup', g);
            document.getElementById('group-modal').style.display = 'none';
            renderSchedule();
        }

        async function refreshData() {
            try {
                const r = await fetch('data.json?v=' + Date.now());
                fullData = await r.json();
                renderSchedule();
            } catch(e) { console.log("Ошибка загрузки данных"); }
        }

        function renderSchedule() {
            document.getElementById('group-title').innerText = "ГРАФИК ОТКЛЮЧЕНИЙ " + userGroup;
            
            // ЛОГИКА ИСПРАВЛЕНИЯ: берем либо по ключу группы, либо общий schedule
            let raw = fullData[userGroup] || fullData["schedule"];
            
            if (raw) {
                const items = raw.split(',');
                document.getElementById('sched-text').innerHTML = items.map(i => "⚡ " + i.trim()).join('<br>');
                processLogic(raw);
            } else {
                document.getElementById('sched-text').innerText = "ОБНОВИТЕ ДАННЫЕ В БОТЕ";
            }
        }

        function handleNotif() {
            if (Notification.permission === 'granted') {
                alert('Уведомления включены!');
            } else {
                Notification.requestPermission().then(p => { if(p==='granted') location.reload(); });
            }
        }

        function toMinutes(t) {
            const p = t.trim().split(':');
            return parseInt(p[0]) * 60 + parseInt(p[1]);
        }

        function processLogic(schedStr) {
            const now = new Date();
            const kievTime = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Kiev"}));
            const curMin = kievTime.getHours() * 60 + kievTime.getMinutes();
            const curSec = kievTime.getSeconds();
            
            const intervals = schedStr.match(/\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}/g) || [];
            let parsedIntervals = intervals.map(range => {
                const [s, e] = range.split('-').map(toMinutes);
                return { start: s, end: (e === 0 || e < s) ? 1440 : e };
            }).sort((a, b) => a.start - b.start);

            let isOff = false; let targetMin = null;
            for (let i of parsedIntervals) {
                if (curMin >= i.start && curMin < i.end) { isOff = true; targetMin = i.end; break; }
            }
            if (!isOff) {
                const next = parsedIntervals.find(i => i.start > curMin);
                if (next) targetMin = next.start;
            }

            const tV = document.getElementById('timer-val');
            const tC = document.getElementById('timer-comment');
            if (isOff) { tV.className = "countdown timer-red"; tC.innerText = "ДО ВКЛЮЧЕНИЯ СВЕТА:"; }
            else { tV.className = "countdown timer-green"; tC.innerText = "СВЕТ БУДЕТ ЕЩЕ:"; }

            if (targetMin !== null) {
                const diff = (targetMin - curMin) * 60 - curSec;
                const h = Math.floor(diff / 3600).toString().padStart(2, '0');
                const m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
                const s = (diff % 60).toString().padStart(2, '0');
                tV.innerText = `${h}:${m}:${s}`;
            } else { tV.innerText = "00:00:00"; tC.innerText = "ГРАФИК НА СЕГОДНЯ ЗАВЕРШЕН"; }
        }

        function updateTime() {
            const now = new Date();
            const options = { timeZone: 'Europe/Kiev', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('kiev-time').innerText = "KIEV: " + new Intl.DateTimeFormat('en-GB', options).format(now);
            if (fullData[userGroup] || fullData["schedule"]) {
                processLogic(fullData[userGroup] || fullData["schedule"]);
            }
        }

        if (Notification.permission === 'granted') {
            const b = document.getElementById('notif-btn');
            b.innerText = "🔕 Уведомления активны"; b.classList.add('active');
        }

        setInterval(updateTime, 1000);
        setInterval(refreshData, 10000);
        refreshData();
    </script>
</body>
</html>
